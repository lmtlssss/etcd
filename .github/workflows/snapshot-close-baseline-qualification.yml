name: Database snapshot close-error original-source baseline (expected failure)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: proof/snapshot-close-baseline-20261025
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache: true
          cache-dependency-path: server/go.sum
      - name: Confirm original snapshot SaveDBFrom ignores close hook
        working-directory: server
        run: go test -count=1 -run 'TestSaveDBFromRejectsCloseFailureBeforePublishing|TestSaveDBFromPreservesCopyErrorAlongsideCloseFailure' ./etcdserver/api/snap
